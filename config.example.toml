[hotkey]
key = "F12"
mode = "push_to_talk"

[audio]
device = ""
sample_rate = 16000

[whisper]
model_path = "~/.local/share/murrly/models/ggml-large-v3-turbo.bin"
device = "cuda"
compute_type = "float16"
language = ""
beam_size = 5
# Карта, на которую грузится Whisper. Нужна потому, что CUDA нумерует
# устройства от самого быстрого, и её «устройство 0» — это большая карта,
# обычно нужная под другую работу.
#   "weakest"  — выбрать самую маленькую карту, на которую влезает модель;
#   "3070"     — подстрока имени карты без учёта регистра
#                ("3070" попадает в "NVIDIA GeForce RTX 3070");
#   ""         — без предпочтения, карту выбирает CUDA.
# Названная карта, которой в машине нет, молча откатывает выбор к умолчанию
# CUDA. Только Linux/CUDA; перекрывается CUDA_VISIBLE_DEVICES из окружения.
preferred_gpu = "weakest"
initial_prompt = """
Мы обсуждаем программирование и архитектуру: React, TypeScript,
Docker, Kubernetes, microservices, middleware, observability,
PostgreSQL, gRPC, REST, Redis, Kafka, CI/CD, monorepo,
frontend, backend, service mesh.
"""

[output]
paste_delay_ms = 80
restore_primary = true
# Что вставка через буфер обмена делает с содержимым буфера.
# false (по умолчанию) — сохраняющий режим: запомнить буфер, положить туда
#   диктовку, нажать Ctrl+V, вернуть исходное. Честно работает там, где
#   приложение действительно спрашивает владельца выделения (GTK, терминалы, Qt).
# true — затирающий: положить диктовку и оставить её в буфере. Для
#   Chromium/Electron, которые вставляют из своего кэша: там возврат буфера как
#   раз и подсовывает прошлое содержимое, а ожидание чтения тормозит вставку.
# Переключается в трее пунктом «Затирать буфер обмена».
clipboard_replace = false
# Mask Russian obscene words (мат) with "•" at display and insertion only;
# the recognized text is always stored/scored uncensored. Toggle live from
# the tray ("Фильтр мата"). On by default.
profanity_filter = true
# Adapt the inserted text to the cursor's surroundings in the focused field
# (capitalisation, leading space, terminal punctuation) — Linux/AT-SPI.
# The tray item "Контекстная вставка" applies the per-app prerequisites.
context_insert = true
# Сколько последних распознанных фраз держать в меню трея кликабельными
# слотами для копирования. По умолчанию 20; зажимается в [1,50].
recent_transcripts = 20
